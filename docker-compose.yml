
services:
  migrate:
    build:
      context: .
      network: host
      target: application
    env_file: .env
    command: ["bun", "run", "--cwd", "packages/db", "db:deploy"]
    restart: "no"

  api:
    build:
      context: .
      network: host
      target: api
    env_file: .env
    environment:
      PORT: "8000"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ws:
    build:
      context: .
      network: host
      target: ws
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      - "${WS_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      network: host
      target: web
      args:
        # Browser-facing URLs (the browser talks to the published host ports).
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    environment:
      PORT: "3001"
    ports:
      - "${WEB_HOST_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
      ws:
        condition: service_started
    restart: unless-stopped
