# Render Blueprint for the HTTP API (apps/http-server).
# Dashboard → New → Blueprint → pick this repo; fill in the `sync: false` vars.
# The WebSocket server (apps/ws-server) is intentionally not included yet.
services:
  - type: web
    name: vexio-api
    runtime: node
    plan: free
    # db:deploy = prisma migrate deploy + prisma generate (needs DIRECT_URL).
    # Always go through the workspace's pinned Prisma — never `bunx prisma`,
    # which resolves the latest major and breaks the CLI surface.
    buildCommand: bun install --frozen-lockfile && bun run db:deploy
    startCommand: bun apps/http-server/index.ts
    healthCheckPath: /
    envVars:
      - key: BUN_VERSION
        value: 1.3.14
      - key: NODE_ENV
        value: production
      # Web app and API on unrelated sites (vercel.app + onrender.com):
      # session cookies must be SameSite=None. Drop this once both move to
      # subdomains of one domain and COOKIE_DOMAIN is set instead.
      - key: CROSS_SITE_AUTH
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # This service's own public URL, e.g. https://vexio-api.onrender.com
      - key: BETTER_AUTH_URL
        sync: false
      # The Vercel URL, e.g. https://vexio.vercel.app (CORS + trusted origin)
      - key: WEB_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
