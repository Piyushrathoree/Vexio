# Render Blueprint for the HTTP API (apps/http-server).
# Dashboard → New → Blueprint → pick this repo; fill in the `sync: false` vars.
# The WebSocket server (apps/ws-server) is intentionally not included yet.
services:
  - type: web
    name: vexio-api
    runtime: node
    plan: free
    # db:deploy = prisma migrate deploy + prisma generate (needs DIRECT_URL).
    # Always go through the workspace's pinned Prisma — never `bunx prisma`,
    # which resolves the latest major and breaks the CLI surface.
    buildCommand: bun install && bun run db:deploy
    startCommand: bun apps/http-server/index.ts
    healthCheckPath: /
    envVars:
      - key: BUN_VERSION
        value: 1.3.14
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # The origin the BROWSER uses for auth. The web app proxies /api/auth/*
      # to this service (see apps/web/next.config.ts), so better-auth must
      # build its callback URLs against the web origin, not this one.
      - key: BETTER_AUTH_URL
        value: https://vexio-web-eta.vercel.app
      # Browser origins allowed by CORS and better-auth trustedOrigins.
      # Comma-separated; localhost dev ports are always allowed on top of this.
      - key: WEB_URL
        value: https://vexio-web-eta.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
