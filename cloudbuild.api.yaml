# Invoke with:
# gcloud builds submit --config cloudbuild.api.yaml --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/REPOSITORY/orin-api:TAG .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "api", "--tag", "${_IMAGE}", "."]

images:
  - "${_IMAGE}"

options:
  logging: CLOUD_LOGGING_ONLY
